version: "3.9"

services:
  wyoming-onnx-asr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CPU: "0"
    image: wyoming-onnx-asr:gpu
    ports:
      - "10300:10300"
    environment:
      - ONNX_AS_MODELS_DIR=/opt/wyoming-onnx-asr/data/models
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../data/models/istupakov/parakeet-tdt-0.6b-v2-onnx/:/opt/wyoming-onnx-asr/data/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--model", "parakeet-v2", "--uri", "tcp://0.0.0.0:10300"]
