version: "3.9"

services:
  wyoming-onnx-asr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CPU: "1"
    image: wyoming-onnx-asr:cpu
    ports:
      - "10300:10300"
    volumes:
      - ../data/models/:/root/.cache/huggingface
    command: ["--model", "parakeet-v2", "--cpu", "--uri", "tcp://0.0.0.0:10300"]
